[project]
name = "streakly"
version = "0.37.0"
description = "Prova de conceito offline de acompanhamento de estudos"
requires-python = ">=3.14,<3.15"
dependencies = ["flet==1.0.5", "flet-android-notifications==0.12.0"]

[tool.flet]
product = "Streakly"
bundle_id = "com.streakly.poc"
build_number = 32

[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true

[tool.flet.app]
path = "."
module = "main"
exclude = [".venv", ".git", ".flet", ".vscode", "__pycache__", "docs", "tests", "README.md", "requirements.txt", "build_android.py"]
